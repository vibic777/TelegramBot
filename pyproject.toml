[project]
name = "lmstudio-telegram-bot"
version = "0.1.0"
description = "Telegram chat bot backed by a local LM Studio OpenAI-compatible API"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
	"psutil>=7.0,<8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
